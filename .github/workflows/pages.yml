name: Deploy na GitHub Pages

# Aplikacja jest statyczna; wspólny skrypt pakuje moduły przeglądarki
# do tego samego katalogu, który sprawdzają testy E2E.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Przygotuj katalog do publikacji
        # Kopiujemy tylko to, co przeglądarka faktycznie pobiera. Publikowanie
        # całego repozytorium wystawiłoby także package.json, testy
        # i konfigurację — bez żadnego pożytku dla odwiedzającego.
        run: node scripts/build-site.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
