name: Deploy na GitHub Pages

# Aplikacja jest statyczna; wspólny skrypt pakuje moduły przeglądarki
# do tego samego katalogu, który sprawdzają testy E2E.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Przygotuj katalog do publikacji
        # Kopiujemy tylko to, co przeglądarka faktycznie pobiera. Publikowanie
        # całego repozytorium wystawiłoby także package.json, testy
        # i konfigurację — bez żadnego pożytku dla odwiedzającego.
        run: node scripts/build-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
