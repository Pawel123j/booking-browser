name: Deploy na GitHub Pages

# Aplikacja jest statyczna; wspólny skrypt pakuje moduły przeglądarki
# do tego samego katalogu, który sprawdzają testy E2E.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Przygotuj katalog do publikacji
        # Kopiujemy tylko to, co przeglądarka faktycznie pobiera. Publikowanie
        # całego repozytorium wystawiłoby także package.json, testy
        # i konfigurację — bez żadnego pożytku dla odwiedzającego.
        run: node scripts/build-site.mjs

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
