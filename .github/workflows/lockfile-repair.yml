name: Temporary lockfile repair verification

on:
  push:
    branches: ["codex/portfolio-polish-2026-11-02"]
    paths: [".github/workflows/lockfile-repair.yml"]

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Re-resolve vulnerable packages without forced major upgrades
        run: |
          npm ci
          npm audit fix --package-lock-only
      - name: Verify corrected lockfile against security gate and tests
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
      - name: Export validated lockfile for review (base64)
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('package-lock.json').toString('base64');for(let i=0;i<b.length;i+=6000)console.log('LOCKFILE_CHUNK_'+i+':'+b.slice(i,i+6000));console.log('LOCKFILE_DONE')"
