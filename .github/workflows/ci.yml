name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testy jednostkowe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Testy
        run: npm test

      - name: Audyt zależności
        run: npm audit

  syntax:
    name: Składnia modułów przeglądarkowych
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sprawdź, czy moduły się parsują
        run: |
          for f in app.js availability.js dateUtils.js dataStore.js storage.js; do
            node --check "$f" && echo "OK: $f"
          done
